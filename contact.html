  <style>
    :root {
      --bg: #f8fafc; --white: #ffffff; --text: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --primary: #2563eb; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: var(--primary); text-decoration: none; }
    .container { width: min(800px, calc(100% - 32px)); margin: auto; padding: 40px 0; }
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 16px 0; }
    .nav { display: flex; justify-content: space-between; align-items: center; width: min(1120px, calc(100% - 32px)); margin: auto; }
    .logo { font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 8px; color: var(--text); }
    .logo-mark { width: 32px; height: 32px; background: var(--primary); color: #fff; border-radius: 8px; display: grid; place-items: center; font-weight: 800; }
    .content-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin-top: 24px; }
    h1 { font-size: 32px; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 15px; margin-bottom: 16px; }
    .contact-info { background: #f1f5f9; padding: 20px; border-radius: 12px; margin-top: 20px; }
    footer { padding: 30px 0; background: #0f172a; color: #94a3b8; text-align: center; font-size: 12px; margin-top: 60px; }
